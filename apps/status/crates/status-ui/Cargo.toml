[package]
name = "status-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "dx-tray — menubar/tray stub for status"

[[bin]]
name = "dx-tray"
path = "src/main.rs"

[features]
default = ["tray"]
# Native tray via tray-icon (ksni / StatusNotifierItem on Linux).
# GPUI + gpui-tray (+ gpui-kit) is the intended longer-term stack; see README.
tray = ["dep:tray-icon"]

[dependencies]
status-core = { workspace = true }
anyhow = { workspace = true }
tray-icon = { version = "0.26", optional = true, default-features = false, features = ["ksni"] }

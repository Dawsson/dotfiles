[workspace]
resolver = "2"
members = [
    "crates/status-core",
    "crates/status-cli",
    "crates/status-ui",
]
default-members = [
    "crates/status-core",
    "crates/status-cli",
    "crates/status-ui",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Dawsson/dotfiles"
rust-version = "1.90"

[workspace.dependencies]
status-core = { path = "crates/status-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

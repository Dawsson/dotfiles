set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Set Ghostty window/tab title to tmux session name
set -g set-titles on
set -g set-titles-string "#{session_name} — #{pane_title}"

# ------- Gruvbox dark theme -------
# Status bar
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left "#[bg=#b8bb26,fg=#282828,bold] #S #[bg=#3c3836,fg=#b8bb26]"
set -g status-left-length 20
set -g status-right "#[fg=#665c54]#[bg=#665c54,fg=#ebdbb2] %H:%M "
set -g status-right-length 20

# Window tabs
set -g window-status-format "#[fg=#a89984] #I:#W "
set -g window-status-current-format "#[fg=#fabd2f,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#b8bb26"
set -g pane-border-status top
set -g pane-border-format "#[fg=#ebdbb2,bg=#504945] #{pane_title} "

# Message / command line
set -g message-style "bg=#504945,fg=#ebdbb2"

# ------- Plugins -------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Morantron/tmux-fingers'

# tmux-fingers: press Ctrl-b F to highlight copyable text
set -g @fingers-key F

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Terminal copy/paste uses Ctrl+Shift, because Ctrl+C is SIGINT.
# keyd-application-mapper reads this file and passes each line to `keyd bind`.
# The left side is <layer>.<key> (the cmd layer from default.conf), not a keyd.conf key.
# `keyd check` does not understand this file. Class names vary by compositor;
# add a section if `keyd-application-mapper -v` shows another one.

[ghostty]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.x = C-S-x
cmd.w = C-S-w
cmd.q = C-S-q

[com.mitchellh.ghostty]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.x = C-S-x
cmd.w = C-S-w
cmd.q = C-S-q

[org.gnome.Terminal]

# Terminal overrides for the cmd layer (physical Alt = Command).
# keyd-application-mapper reads this and passes each line to `keyd bind`.
# Left side is <layer>.<key>; `keyd check` does not understand this file.
#
# Ctrl is never remapped by keyd. Terminals themselves bind Ctrl+C/V to copy/paste
# (see Ghostty config + gnome.sh). Alt+C must still interrupt, so cmd.c emits a
# chord Ghostty maps to literal ^C (ETX). Class names vary; add a section when
# `keyd-application-mapper -v` shows another one.

[ghostty]
cmd.c = C-S-c
cmd.w = C-S-w
cmd.q = C-S-q
cmd.t = C-S-t
cmd.n = C-S-n

[com.mitchellh.ghostty]
cmd.c = C-S-c
cmd.w = C-S-w
cmd.q = C-S-q
cmd.t = C-S-t
cmd.n = C-S-n


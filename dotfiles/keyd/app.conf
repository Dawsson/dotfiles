# Optional per-app overrides for the cmd layer (physical Alt = Command).
# keyd-application-mapper reads this and passes each line to `keyd bind`.
# Left side is <layer>.<key>; `keyd check` does not understand this file.
#
# Terminal Ctrl+C/V copy/paste and Alt+C interrupt are configured natively
# (Ghostty keybinds + gnome.sh Ptyxis/GNOME Terminal gsettings) and do NOT
# need this file. keyd default.conf maps Alt+C → Ctrl+Insert globally so
# Ghostty can bind that to text:\x03 without a per-app override.
#
# Close/tab chords below still need the mapper (broken on GNOME Shell 50
# until the keyd GNOME extension lists shell 50). Class names vary; add a
# section when `keyd-application-mapper -v` shows another one.

[ghostty]
cmd.w = C-S-w
cmd.q = C-S-q
cmd.t = C-S-t
cmd.n = C-S-n

[com.mitchellh.ghostty]
cmd.w = C-S-w
cmd.q = C-S-q
cmd.t = C-S-t
cmd.n = C-S-n

[org.gnome.Terminal]
cmd.w = C-S-w
cmd.q = C-S-q
cmd.t = C-S-t
cmd.n = C-S-n

[kgx]
cmd.w = C-S-w
cmd.q = C-S-q
cmd.t = C-S-t
cmd.n = C-S-n

[ptyxis]
cmd.w = C-S-w

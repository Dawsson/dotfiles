# dawsson-dotfiles
# Fedora / Linux only (macOS keeps native keys).
#
# Physical position map (US keyboard, Alt where Mac Command sits):
#   Left/Right Alt  = macOS Command
#   Super/Win       = macOS Option
#   Ctrl            = Control (never remapped)
#
# Alt alone does nothing (no menu-bar focus). Super tap still opens GNOME overview.
# Chords GNOME must see (launcher, screenshots, minimize, …) are re-emitted as
# Super chords. Everything else on the cmd layer inherits Control so Alt+C/V/X/Z/A
# match Command muscle memory without touching physical Ctrl.

[ids]
*

[main]
leftalt = layer(cmd)
rightalt = layer(cmd)
leftmeta = overload(opt, leftmeta)
rightmeta = overload(opt, rightmeta)

# Command (physical Alt). :C = unbound letters become Ctrl+letter.
# Close/Quit are Ctrl+W / Ctrl+Q (terminals override in app.conf).
# Launcher / minimize / hide / window-cycle stay Super chords for gsettings.
[cmd:C]
space = macro(leftmeta+space)
m = macro(leftmeta+m)
h = macro(leftmeta+h)
grave = macro(leftmeta+grave)
w = C-w
q = C-q
# Hold-Alt app switcher: first Tab enters a layer that keeps Alt down.
tab = swapm(appswitch, A-tab)
left = home
right = end
up = C-home
down = C-end
# Cmd+Backspace = delete to start of line (select to Home, then delete).
backspace = macro(S-home, backspace)

# App switcher while Command (Alt) is held — Tab cycles, Shift+Tab reverses.
[appswitch:A]
tab = A-tab
shift = layer(appswitch_shift)

[appswitch_shift:A]
tab = A-S-tab

# Cmd+Shift — selection variants, screenshots, 1Password, reverse switcher.
# Explicit bindings do not inherit Shift, so include it in the tap.
[cmd+shift]
space = macro(leftshift+leftmeta+space)
tab = swapm(appswitch, A-S-tab)
3 = macro(leftshift+leftmeta+3)
4 = macro(leftshift+leftmeta+4)
5 = macro(leftshift+leftmeta+5)
left = S-home
right = S-end
up = C-S-home
down = C-S-end

# Cmd+Ctrl — fullscreen and lock (physical Ctrl+Alt+F / Ctrl+Alt+Q).
[cmd+control]
f = macro(leftcontrol+leftmeta+f)
q = macro(leftmeta+l)

# Option (physical Super) — word navigation / delete word.
[opt]
left = C-left
right = C-right
backspace = C-backspace

[opt+shift]
left = C-S-left
right = C-S-right

# Cmd+Option (Alt+Super) — Force Quit ≈ open system monitor (Wayland has no xkill).
[cmd+opt]
esc = macro(leftcontrol+leftshift+escape)

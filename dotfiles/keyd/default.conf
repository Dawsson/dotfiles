# dawsson-dotfiles
# Super (the key in the Command position) acts like Command for app shortcuts.
# A tap still emits Super so GNOME can open the overview.
# Super+Space is a real Super+Space chord, same mechanism as the working
# Shift+Super+Space binding. GNOME binds that chord to Ulauncher.
# Shift+Super+Space still opens 1Password Quick Access.

[ids]
*

[main]
leftmeta = overload(cmd, macro(leftmeta))
rightmeta = overload(cmd, macro(rightmeta))

# Inherit Control for the usual Command chords (copy, paste, cut, undo).
# Super+W is Close, like Command+W: it sends Ctrl+W, which closes a tab or
# window and leaves the app running when the app does that. It is not Alt+F4
# and it does not minimize. Super+Q is Quit, like Command+Q (Ctrl+Q).
# Terminals override those two in app.conf so Ctrl+W can still delete a word.
[cmd:C]
space = macro(leftmeta+space)
w = macro(leftcontrol+w)
q = macro(leftcontrol+q)
tab = M-tab
left = home
right = end
up = C-home
down = C-end
backspace = C-backspace

# Defined after cmd and the built-in shift layer. An explicit binding here
# does not inherit Shift, so the tap includes it.
[cmd+shift]
space = macro(leftshift+leftmeta+space)

# dawsson-dotfiles
# Super (the key in the Command position) acts like Command for app shortcuts.
# A tap still emits Super so GNOME can open the overview.
# Super+Space is sent as F14. GNOME binds F14 to Ulauncher, so the
# input-source shortcut cannot swallow Super+Space.
# Shift+Super+Space is a separate chord and still opens 1Password Quick Access.

[ids]
*

[main]
leftmeta = overload(cmd, macro(leftmeta))
rightmeta = overload(cmd, macro(rightmeta))

# Inherit Control, then put desktop chords back.
# Super+C/V/X/Z/A/S/F/T/W/Q and the rest of the letter keys follow Ctrl.
[cmd:C]
space = f14
tab = M-tab
left = home
right = end
up = C-home
down = C-end
backspace = C-backspace

# Defined after cmd and the built-in shift layer. An explicit binding here
# does not inherit Shift, so the tap includes it.
[cmd+shift]
space = macro(leftshift+leftmeta+space)
